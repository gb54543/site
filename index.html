<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FN Competitive</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #050507;
  color: white;
  font-family: 'Orbitron', sans-serif;
}

/* NAVBAR */
<div class="navbar">
  <div class="logo">DRAVEX</div>

  <div class="menu">
    <a href="index.html">Início</a>
    <a href="torneios.html">Torneios</a>
    <a href="loja.html">Loja</a>
    <a href="comunidade.html">Comunidade</a>
  </div>

  <a href="login.html" class="login">Entrar</a>
</div>

/* HERO */
.hero {
  height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  /* DEGRADE TOP */
  background:
    radial-gradient(circle at left, rgba(124,58,237,0.3), transparent 40%),
    radial-gradient(circle at right, rgba(168,85,247,0.3), transparent 40%),
    #050507;
}

.hero small {
  color: #a855f7;
  letter-spacing: 3px;
}

/* TITULOS */
.hero h1 {
  font-size: 70px;
  margin: 10px 0;
}

.hero h2 {
  font-size: 80px;
  color: #a855f7;
  margin: 0;

  /* GLOW */
  text-shadow: 0 0 20px #a855f7;
}

.hero p {
  color: #888;
  max-width: 500px;
  margin: 20px auto;
}

/* BOTÕES */
.buttons {
  margin-top: 20px;
}

.btn-main {
  background: #7c3aed;
  padding: 12px 25px;
  border-radius: 8px;
  display: inline-block;
  margin: 10px;
  cursor: pointer;
}

.btn-sec {
  border: 1px solid #444;
  padding: 12px 25px;
  border-radius: 8px;
  display: inline-block;
  margin: 10px;
  cursor: pointer;
}

/* STATS */
.stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 40px;
}

.stat h3 {
  color: #a855f7;
}

.stat p {
  color: #777;
  font-size: 12px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">DRAVEX</div>

  <div class="menu">
    <a href="#">Início</a>
    <a href="#">Torneios</a>
    <a href="#">Loja</a>
    <a href="#">Comunidade</a>
  </div>

  <div class="login">Entrar</div>
</div>

<!-- HERO -->
<div class="hero">

  <div>
    <small>ORGANIZAÇÃO ESPORTS BRASILEIRA</small>

    <h1>DOMINE O</h1>
    <h2>COMPETITIVO</h2>

    <p>
      Torneios com premiação real, ranking e comunidade ativa.
      Entre agora e suba para o topo.
    </p>

    <div class="buttons">
      <div class="btn-main">Entrar no Discord</div>
      <div class="btn-sec">Ver Torneios</div>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat">
        <h3>18.500+</h3>
        <p>Players</p>
      </div>

      <div class="stat">
        <h3>200+</h3>
        <p>Torneios</p>
      </div>

      <div class="stat">
        <h3>R$85.000+</h3>
        <p>Distribuídos</p>
      </div>

      <div class="stat">
        <h3>99%</h3>
        <p>Aprovação</p>
      </div>
    </div>

  </div>

</div>

</body>
</html>
